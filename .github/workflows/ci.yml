name: CI

on:
  push:
    branches:
      - 'ci/khrystyna'
  pull_request:
    branches:
      - 'ci/khrystyna'
  pull_request_review:
    types: [submitted, edited, dismissed]

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest